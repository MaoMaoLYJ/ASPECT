# Optional GitHub Actions template; it is not enabled automatically.
name: Portable contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_contracts.py tests/test_evaluate_cli.py tests/test_runtime_environment.py tests/test_quick_smoke.py -q -k 'not actual_hydra'
      - run: python -m compileall -q aspect algorithms rllm verl examples dashboard
